# Deploy from the repo root:
#   fly deploy . --config apps/api/fly.toml --dockerfile apps/api/Dockerfile
app = "agro-cpr-api"
primary_region = "gru" # São Paulo, next to the Supabase database

[deploy]
  release_command = "npm run db:migrate"

[env]
  NODE_ENV = "production"
  PORT = "3001"
  AUTH_MODE = "supabase"
  STORAGE_MODE = "supabase"
  STORAGE_BUCKET = "evidence"
  CHAIN_MODE = "base-sepolia"
  RUN_WORKER = "true"
  DELIVERY_TOLERANCE_BPS = "200"

[http_service]
  internal_port = 3001
  force_https = true
  # The worker (anchoring, alerts) runs in the same process, so keep it up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
